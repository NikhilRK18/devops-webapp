name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building DevOps WebApp..."
          test -f index.html
          echo "Build successful!"

      - name: Test
        run: |
          echo "Running tests..."
          test -f index.html
          echo "Tests passed!"

      - name: Generate logs
        run: |
          echo "CI Pipeline completed successfully"
          date
