name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CI
        run: echo "CI Pipeline successful"

      - name: Send Slack Notification
        if: always()
        run: |
          curl -X POST \
          -H 'Content-type: application/json' \
          --data '{"text":"🚀 GitHub Actions CI Pipeline completed for devops-webapp"}' \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
